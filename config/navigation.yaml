controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    enable_stamped_cmd_vel: false
    odom_topic: /odometry/filtered
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.08
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.12
      min_vel_y: -0.12
      max_vel_x: 0.15
      max_vel_y: 0.15
      max_vel_theta: 0.4
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.7
      decel_lim_x: -0.3
      decel_lim_y: -0.3
      decel_lim_theta: -0.7
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 15
      sim_time: 1.5
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.015
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.1
      PathAlign.scale: 16.0
      GoalAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.10
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 12.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 8.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.36
      footprint_padding: 0.02
      transform_tolerance: 0.2
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan0 scan1
        scan0:
          topic: /scan0
          data_type: LaserScan
          marking: true
          clearing: true
          expected_update_rate: 0.3
          inf_is_valid: false
          obstacle_min_range: 0.05
          obstacle_max_range: 5.0
          raytrace_min_range: 0.05
          raytrace_max_range: 6.0
        scan1:
          topic: /scan1
          data_type: LaserScan
          marking: true
          clearing: true
          expected_update_rate: 0.3
          inf_is_valid: false
          obstacle_min_range: 0.05
          obstacle_max_range: 5.0
          raytrace_min_range: 0.05
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    enable_stamped_cmd_vel: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.5
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
